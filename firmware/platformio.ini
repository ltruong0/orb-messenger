; Orb firmware: Waveshare ESP32-S3-Touch-AMOLED-1.75 (see docs/firmware.md, docs/hardware.md)
;
; Toolchain: pioarduino (Arduino core 3.x on ESP-IDF 5.x). The stock `espressif32`
; platform is stuck on core 2.x, which lacks the ESP-IDF MQTT client's Arduino glue
; we rely on and ships an older LittleFS.
;
; Secrets (Wi-Fi + broker password) come from the gitignored `secrets.ini`
; (`make fw-secrets` writes it from .env). Without it the orb boots into the portal.

[platformio]
default_envs = orb
extra_configs = secrets*.ini

[secrets]
build_flags =

[env:orb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DORB_FW_VERSION=\"0.2.1\"
    -DORB_BOARD=143
    -DCORE_DEBUG_LEVEL=3
    -Wno-unused-variable
    ${secrets.build_flags}

lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    lewisxhe/SensorLib@0.5.1
    lewisxhe/XPowersLib@0.3.3
    lvgl/lvgl@9.6.0
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@7.2.2
    fastled/FastLED@3.10.9
