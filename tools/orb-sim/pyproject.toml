[project]
name = "orb-sim"
version = "0.3.0"
description = "Orb Messenger orb simulator: behaves like an orb over MQTT, renders to the terminal"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "starlette>=0.40",
  "uvicorn>=0.32",
]

[project.scripts]
orb-sim = "orb_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orb_sim"]
