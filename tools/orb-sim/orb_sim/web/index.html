<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb simulator</title>
<style>
@font-face{font-family:'Fredoka';src:url('/fonts/fredoka-latin-wght-normal.woff2') format('woff2');font-weight:300 700;font-display:swap}
@font-face{font-family:'DM Sans';src:url('/fonts/dm-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 1000;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800;font-display:swap}

:root{
  --bg:#F5F5FA; --card:#fff; --ink:#1E1B2E; --muted:#6B6880; --line:#E4E3EE;
  --accent:#5B3FE0; --ring:#D9D9E6; --screen:#000; --danger:#D23B3B;
  --head:'Fredoka','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141320;--card:#1D1B2C;--ink:#F2F1F8;--muted:#9B98B0;--line:#2C2A3E;--ring:#33314A}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{padding:16px;padding-bottom:40px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:4px 0 18px}
header h1{font:600 26px var(--head);margin:0}
header .meta{color:var(--muted);font-size:14px}
header .meta code{font-family:var(--mono);font-size:13px}
#conn{display:inline-block;width:9px;height:9px;border-radius:50%;background:#C9C8D6;margin-right:6px;vertical-align:middle}
#conn.ok{background:#2EC86E}#conn.bad{background:var(--danger)}

.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));max-width:1400px;margin:0 auto}
.orb{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.orb .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.orb .name{font:600 20px var(--head)}
.orb .id{font-family:var(--mono);font-size:13px;color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.badge{padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink);font-weight:600;letter-spacing:.02em;text-transform:uppercase;font-size:11px}
.badge.on{background:#DDF6E7;color:#157A42}.badge.off{background:#FBE1E1;color:#A32B2B}
.badge.led{text-transform:none;font-family:var(--mono);font-weight:500}

/* enclosure + LED glow */
.enc-wrap{width:100%;max-width:466px;aspect-ratio:1;margin:0 auto;position:relative}
.enc{position:absolute;inset:0;border-radius:50%;background:var(--ring);padding:1.6%;box-shadow:0 0 0 0 transparent;transition:box-shadow .4s}
.enc.led-on{--glow:#FF2D2D}
.enc.breathe{animation:breathe 2.6s ease-in-out infinite}
.enc.pulse{animation:pulse 1.2s ease-in-out infinite}
.enc.blink{animation:blinkled 1s steps(1) infinite}
.enc.solid{box-shadow:0 0 44px 10px color-mix(in srgb,var(--glow) 70%,transparent)}
@keyframes breathe{0%,100%{box-shadow:0 0 18px 2px color-mix(in srgb,var(--glow) 35%,transparent)}50%{box-shadow:0 0 56px 14px color-mix(in srgb,var(--glow) 80%,transparent)}}
@keyframes pulse{0%,100%{box-shadow:0 0 10px 0 color-mix(in srgb,var(--glow) 30%,transparent)}30%{box-shadow:0 0 50px 12px color-mix(in srgb,var(--glow) 85%,transparent)}}
@keyframes blinkled{0%,49%{box-shadow:0 0 44px 10px color-mix(in srgb,var(--glow) 75%,transparent)}50%,100%{box-shadow:none}}
.screen-clip{position:absolute;inset:1.6%;border-radius:50%;overflow:hidden;background:var(--screen);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.screen{width:466px;height:466px;transform-origin:top left;position:relative;color:#fff;font-family:var(--body)}
.screen .safe{position:absolute;left:68px;top:68px;width:330px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.screen .small{font-size:20px;color:#A9A7B8;line-height:1.3}
.screen .mono{font-family:var(--mono);font-size:19px;color:#A9A7B8}
.screen .head{font:600 34px var(--head);line-height:1.15}
.screen .big{font:600 44px var(--head);line-height:1.12;overflow-wrap:anywhere}
.screen .big.s36{font-size:36px}.screen .big.s30{font-size:30px}
.screen .code{font:700 128px/1 var(--head);letter-spacing:.02em;margin:6px 0}
.screen .caption{font:600 30px var(--head);line-height:1.15}
.screen .heart{width:104px;height:104px}
.screen .sticker{width:160px;height:160px;image-rendering:auto}
.screen .photo{position:absolute;inset:0;width:466px;height:466px;object-fit:cover}
.screen .pill{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:rgba(20,18,30,.85);color:#fff;padding:8px 18px;border-radius:999px;font-size:19px;white-space:nowrap}
.screen .pill.caption-pill{bottom:120px;font:600 24px var(--head)}
/* eyes */
.eyes{display:flex;gap:80px;margin-bottom:28px}
.eye{width:56px;height:100px;background:#F6F5FB;border-radius:28px;animation:blink 5.5s infinite}
.eye.r{animation-delay:.02s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.happy{display:flex;gap:76px;margin-bottom:26px}
.happy span{width:64px;height:32px;border:12px solid #F6F5FB;border-bottom:0;border-radius:64px 64px 0 0;box-sizing:border-box}
.spinner{width:72px;height:72px;border-radius:50%;background:conic-gradient(#F0B33B 0 25%,#2B2938 25% 100%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:spin 1.1s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.screen .err{position:absolute;inset:0;background:#3A0D0D;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:70px;text-align:center}
.screen .err b{font:700 30px var(--head);color:#FF8A8A}.screen .err div{font-family:var(--mono);font-size:15px;color:#FFD2D2;overflow-wrap:anywhere}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:50%}
.flash.go{animation:flash .25s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 15px var(--body);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.warn{color:#A32B2B}
select{font:500 15px var(--body);padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;max-width:150px}
.hint{color:var(--muted);font-size:13px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.log{font-family:var(--mono);font-size:12px;line-height:1.45;max-height:220px;overflow:auto;margin-top:6px;padding:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.log div{display:flex;gap:8px}.log .t{color:var(--muted);flex:none}
.log .k-tx{color:#1F8F4E}.log .k-rx{color:#3759D6}.log .k-led{color:#9A3BC2}.log .k-net{color:#1F8FA0}.log .k-screen{font-weight:700}.log .k-warn{color:#B8780A}.log .k-error{color:var(--danger);font-weight:700}.log .k-info{color:var(--muted)}
.nvs{font-family:var(--mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <h1>Orb simulator</h1>
  <span class="meta"><span id="conn"></span>broker <code id="broker">…</code> · tap the screen to open, hold ≥ 600 ms to react</span>
</header>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById('grid');
const cards = new Map();   // id -> {el, screenKey, ...}

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hhmm(ts){const d = new Date(ts*1000); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function sizeClass(t){const n=(t||'').length; return n<=22?'':(n<=44?'s36':'s30');}
const HEART = '<svg class="heart" viewBox="0 0 24 24"><path fill="#FF4D4D" d="M12 21s-7.5-4.6-9.6-9.2C1 8.3 3.2 4.5 6.8 4.5c2 0 3.5 1 4.2 2.4C11.7 5.5 13.2 4.5 15.2 4.5c3.6 0 5.8 3.8 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

function screenHTML(o, broker){
  if (o.error) {
    return `<div class="err"><b>CONTRACT VIOLATION</b><div>${esc(o.error.kind)}: ${esc(o.error.problems.join(' · '))}</div><div class="small">sim stopped (strict mode)</div></div>`;
  }
  const s = o.state, m = o.message, cfg = o.config || {};
  if (s === 'unreachable' || !o.connected) {
    return `<div class="safe"><div class="spinner"></div><div class="head">Can't reach the hub…</div><div class="small">${esc(broker)}<br>hold the button 5 s to redo Wi-Fi setup</div></div>`;
  }
  if (s === 'unconfigured') {
    return `<div class="safe"><div class="small">waiting for the hub</div><div class="mono">${esc(o.id)}</div></div>`;
  }
  if (s === 'pairing') {
    return `<div class="safe"><div class="small">pair me</div><div class="code">${esc(cfg.code)}</div><div class="mono">${esc(o.id)}</div><div class="small" style="color:#E8E6F3">enter this code in the app</div></div>`;
  }
  if (s === 'receipt' && o.notice) {
    const n = o.notice;
    const what = n.type === 'read_receipt' ? `${esc(n.by)} read it` : `${esc(n.by)} sent ${esc(n.sticker)}`;
    return `<div class="safe"><div class="happy"><span></span><span></span></div><div class="head">${what}</div></div>`;
  }
  if (s === 'nothing') {
    const last = m ? `last one from ${esc(m.from_name)} · ${hhmm(m.ts)}` : '';
    return `<div class="safe"><div class="happy"><span></span><span></span></div><div class="head">no new messages</div><div class="small">${last}</div></div>`;
  }
  if (s === 'unread' && m) {
    return `<div class="safe">${HEART}<div class="head">New from ${esc(m.from_name)}</div><div class="small">tap to open</div></div>`;
  }
  if (s === 'show' && m) {
    const who = `${esc(m.from_name)} · ${hhmm(m.ts)}`;
    if (m.type === 'text') {
      return `<div class="safe"><div class="small">${who}</div><div class="big ${sizeClass(m.text)}">${esc(m.text)}</div><div class="small">hold to send a heart back</div></div>`;
    }
    if (m.type === 'sticker') {
      const img = m.sticker_url ? `<img class="sticker" src="${m.sticker_url}" alt="${esc(m.sticker)}">` : `<div class="mono">[${esc(m.sticker)} not cached]</div>`;
      return `<div class="safe">${img}${m.text ? `<div class="caption">${esc(m.text)}</div>` : `<div class="small">${who}</div>`}</div>`;
    }
    if (m.type === 'photo') {
      const img = m.photo_url ? `<img class="photo" src="${m.photo_url}" alt="photo">` : `<div class="safe"><div class="mono">[photo not fetched]</div></div>`;
      return `${img}${m.text ? `<div class="pill caption-pill">${esc(m.text)}</div>` : ''}<div class="pill">from ${esc(m.from_name)}</div>`;
    }
  }
  // idle (and anything else)
  return `<div class="safe"><div class="eyes"><div class="eye"></div><div class="eye r"></div></div><div class="small">${esc(cfg.name || '')}</div></div>`;
}

function makeCard(o){
  const el = document.createElement('section');
  el.className = 'orb';
  el.innerHTML = `
    <div class="top"><div><div class="name"></div><div class="id">${esc(o.id)}</div></div><div class="badges"></div></div>
    <div class="enc-wrap"><div class="enc"><div class="screen-clip"><div class="screen"></div><div class="flash"></div></div></div></div>
    <div class="controls">
      <button class="primary" data-act="tap">Tap</button>
      <button data-act="hold">Hold</button>
      <select class="stk" title="sticker to send on hold"></select>
      <button data-act="drop">Drop 5 s</button>
      <button class="warn" data-act="reboot">Reboot</button>
    </div>
    <div class="nvs"></div>
    <details open><summary>log</summary><div class="log"></div></details>`;
  grid.appendChild(el);
  const c = {el, screenKey: null, stkKey: null,
    screen: el.querySelector('.screen'), clip: el.querySelector('.screen-clip'), enc: el.querySelector('.enc'),
    flash: el.querySelector('.flash'), name: el.querySelector('.name'), badges: el.querySelector('.badges'),
    stk: el.querySelector('.stk'), nvs: el.querySelector('.nvs'), log: el.querySelector('.log')};
  // scale the 466 px screen to the card
  const wrap = el.querySelector('.enc-wrap');
  const fit = () => { const w = wrap.clientWidth * (1 - 0.032); c.screen.style.transform = `scale(${w/466})`; };
  new ResizeObserver(fit).observe(wrap); fit();
  // buttons
  el.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => act(o.id, b.dataset.act, c)));
  // touch: tap vs hold on the screen itself
  let t0 = 0, timer = null, held = false;
  c.clip.addEventListener('pointerdown', e => { e.preventDefault(); t0 = Date.now(); held = false; timer = setTimeout(() => { held = true; act(o.id, 'hold', c); }, 600); });
  const up = () => { if (!t0) return; clearTimeout(timer); if (!held && Date.now() - t0 < 600) act(o.id, 'tap', c); t0 = 0; };
  c.clip.addEventListener('pointerup', up); c.clip.addEventListener('pointercancel', () => { clearTimeout(timer); t0 = 0; });
  c.clip.addEventListener('pointerleave', () => { clearTimeout(timer); t0 = 0; });
  c.clip.addEventListener('contextmenu', e => e.preventDefault());
  return c;
}

async function act(id, what, c){
  const body = what === 'hold' ? {sticker: c.stk.value || 'purple-heart'} : (what === 'drop' ? {seconds: 5} : {});
  c.flash.classList.remove('go'); void c.flash.offsetWidth; c.flash.classList.add('go');
  const r = await fetch(`/api/orbs/${id}/${what}`, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) console.warn(what, await r.text());
}

function render(snap){
  document.getElementById('broker').textContent = snap.broker;
  for (const o of snap.orbs) {
    let c = cards.get(o.id);
    if (!c) { c = makeCard(o); cards.set(o.id, c); }
    const cfg = o.config || {};
    c.name.textContent = cfg.state === 'active' ? cfg.name : (cfg.state === 'pending' ? 'pairing…' : 'unpaired orb');
    const led = o.led || {mode: 'off'};
    c.badges.innerHTML = `<span class="badge ${o.connected ? 'on' : 'off'}">${o.connected ? 'online' : 'offline'}</span>` +
      `<span class="badge">${esc(o.state)}</span>` +
      (cfg.owner ? `<span class="badge">${esc(cfg.owner)}'s</span>` : '') +
      `<span class="badge led">LED ${esc(led.mode)}${led.color ? ' ' + esc(led.color) : ''}</span>`;
    // LED ring
    c.enc.className = 'enc';
    if (!o.connected && !o.error) { c.enc.classList.add('led-on', 'solid'); c.enc.style.setProperty('--glow', '#F0B33B'); }  // firmware: amber while unreachable
    else if (led.mode !== 'off' && led.color) { c.enc.classList.add('led-on', led.pattern || 'solid'); c.enc.style.setProperty('--glow', led.color); }
    // screen (only rebuild when what's shown changes, so animations/images don't restart)
    const key = JSON.stringify([o.state, o.connected, o.message && o.message.id, o.message && (o.message.sticker_url||o.message.photo_url), o.notice, cfg.code, cfg.name, o.error]);
    if (key !== c.screenKey) { c.screen.innerHTML = screenHTML(o, snap.broker); c.screenKey = key; }
    // sticker picker
    const sk = o.stickers.join(',');
    if (sk !== c.stkKey) {
      const cur = c.stk.value;
      c.stk.innerHTML = (o.stickers.length ? o.stickers : ['purple-heart']).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
      if ([...c.stk.options].some(x => x.value === cur)) c.stk.value = cur; else if (o.stickers.includes('purple-heart')) c.stk.value = 'purple-heart';
      c.stkKey = sk;
    }
    c.nvs.textContent = `fw ${o.fw} · stickers rev ${o.stickers_rev ?? '–'} (${o.stickers.length} cached) · last_received ${o.nvs.last_received_id || '–'} · last_read ${o.nvs.last_read_id || '–'}`;
    // log
    const atBottom = c.log.scrollHeight - c.log.scrollTop - c.log.clientHeight < 30;
    c.log.innerHTML = o.log.map(l => { const d = new Date(l.ts*1000); const t = d.toTimeString().slice(0,8); return `<div><span class="t">${t}</span><span class="k-${esc(l.kind)}">${esc(l.text)}</span></div>`; }).join('');
    if (atBottom) c.log.scrollTop = c.log.scrollHeight;
  }
}

function connect(){
  const es = new EventSource('/api/events');
  const dot = document.getElementById('conn');
  es.addEventListener('state', e => { dot.className = 'ok'; render(JSON.parse(e.data)); });
  es.onerror = () => { dot.className = 'bad'; };
}
connect();
</script>
</body>
</html>
