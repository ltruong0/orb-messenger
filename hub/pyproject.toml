[project]
name = "msg-hub"
version = "0.3.0"
description = "Orb Messenger hub: REST + SSE for phones, MQTT to orbs, SQLite state, media pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiomqtt>=2.3",
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "itsdangerous>=2.2",
  "jsonschema>=4.23",
  "pillow>=11",
  "pillow-heif>=0.20",
  "python-multipart>=0.0.12",
  "python-ulid>=3.0",
  "pyyaml>=6.0",
  "regex>=2024.9",
  "uvicorn>=0.32",
]

[project.scripts]
msg-hub = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
