# Mosquitto 2.x config for Orb Messenger (ConfigMap mosquitto-config at /mosquitto/config; password file is a Secret at /mosquitto/secret)
per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/secret/passwd
acl_file /mosquitto/config/aclfile

# retained state (config/inbox/led/stickers) must survive pod restarts
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_inflight_messages 20
max_queued_messages 1000
max_packet_size 65536

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
