# msg-hub: one replica, SQLite + media on a PVC (docs/deploy.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hub
  labels:
    app: hub
spec:
  selector:
    app: hub
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  labels:
    app: hub
spec:
  replicas: 1
  strategy:
    type: Recreate   # single-writer SQLite
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: hub
          image: ghcr.io/ltruong0/orb-messenger/msg-hub:dev
          imagePullPolicy: Always   # a re-pushed tag must win over the node's cache
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hub-config
            - secretRef:
                name: hub-secret
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi   # Pillow spikes on big photos
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hub-data
