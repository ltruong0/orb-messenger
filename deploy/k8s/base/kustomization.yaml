apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orb
resources:
  - namespace.yaml
  - mosquitto.yaml
  - hub.yaml
configMapGenerator:
  - name: mosquitto-config
    files:
      - mosquitto/mosquitto.conf
      - mosquitto/aclfile
generatorOptions:
  disableNameSuffixHash: true
