<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App · Send</title>
<style>
@font-face{font-family:'Fredoka';src:url('fonts/fredoka-latin-wght-normal.woff2') format('woff2');font-weight:300 700;font-display:block}
@font-face{font-family:'DM Sans';src:url('fonts/dm-sans-latin-wght-normal.woff2') format('woff2');font-weight:100 1000;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800;font-display:block}

body{margin:0}
a{color:#5B3FE0}a:hover{color:#3F27B8}
textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid #5B3FE0;outline-offset:2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F6FB; font-family: 'DM Sans', system-ui, sans-serif; color: #1C1A2E; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fredoka, 'DM Sans', system-ui, sans-serif; font-size: 30px; line-height: 36px; font-weight: 600">Send</h1>
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: #E6F4EC; border-radius: 999px; font-size: 13px; line-height: 16px; color: #1F5E3A"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2E9E5B"></span>hub online</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; letter-spacing: 0.06em; font-weight: 700; color: #4F4C66">TO</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 500; background: #5B3FE0; color: #FFFFFF; border: 1px solid #5B3FE0;">✓ Her office</button><button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 500; background: #FFFFFF; color: #1C1A2E; border: 1px solid #D9D6E8;">Lee's office</button><button type="button" disabled style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 500; background: #F0EEF5; color: #6E6A85; border: 1px dashed #C4C0D6;">Kitchen · offline</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="msg" style="font-size: 12px; line-height: 16px; letter-spacing: 0.06em; font-weight: 700; color: #4F4C66">MESSAGE</label>
<textarea id="msg" rows="2" maxlength="80" style="box-sizing: border-box; width: 100%; resize: none; padding: 14px 16px; border: 1px solid #D9D6E8; border-radius: 16px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 24px; color: #1C1A2E">proud of you today</textarea>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="min-height: 36px; padding: 6px 12px; border: 1px solid #D9D6E8; border-radius: 999px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 18px; color: #3D3A52">thinking of you</button><button type="button" style="min-height: 36px; padding: 6px 12px; border: 1px solid #D9D6E8; border-radius: 999px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 18px; color: #3D3A52">you got this</button><button type="button" style="min-height: 36px; padding: 6px 12px; border: 1px solid #D9D6E8; border-radius: 999px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 18px; color: #3D3A52">lunch?</button><button type="button" style="min-height: 36px; padding: 6px 12px; border: 1px solid #D9D6E8; border-radius: 999px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 18px; color: #3D3A52">proud of you today</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; line-height: 16px; letter-spacing: 0.06em; font-weight: 700; color: #4F4C66">STICKER</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button type="button" aria-label="purple-heart" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">💜</button><button type="button" aria-label="heart-eyes" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #EFEAFF; border: 2px solid #5B3FE0;">🥰</button><button type="button" aria-label="coffee" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">☕</button><button type="button" aria-label="sun" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">🌞</button><button type="button" aria-label="heart-hands" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">🫶</button><button type="button" aria-label="sparkles" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">✨</button><button type="button" aria-label="cat" style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; border-radius: 18px; background: #FFFFFF; border: 1px solid #D9D6E8;">🐱</button>
<a href="13-app-stickers.html" aria-label="Add sticker" style="height: 64px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #A9A4C4; border-radius: 18px; color: #5B3FE0; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>

<div style="display: flex; gap: 10px">
<button type="button" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border: 1px solid #D9D6E8; border-radius: 16px; background: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: #1C1A2E; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>Photo</button>
<button type="button" style="flex-grow: 1; min-height: 52px; border: none; border-radius: 16px; background: #5B3FE0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; color: #FFFFFF; cursor: pointer">Send to 1 orb</button>
</div>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; background: #FFFFFF; border-top: 1px solid #E4E1EE">
<a href="10-app-send.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 14px; font-weight: 700; color: #5B3FE0; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"></path><path d="M21 3l-7 18-4-7-7-4 18-7z"></path></svg>Send</a>
<a href="11-app-history.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 14px; color: #5E5A75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>
<a href="12-app-orbs.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 14px; color: #5E5A75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Orbs</a>
<a href="13-app-stickers.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 14px; color: #5E5A75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"></path><path d="M9 9.5h.01M15 9.5h.01"></path></svg>Stickers</a>
</nav>
</div>
</body>
</html>
